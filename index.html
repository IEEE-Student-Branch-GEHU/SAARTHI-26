<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon (SVG-first, PNG fallback served from /public) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Primary Meta -->
    <title>SAARTHI Hackathon 2026 — Build the Future</title>
    <meta
      name="description"
      content="SAARTHI Hackathon 2026 — A 48-hour Open Innovation hackathon. 2–4 November 2026. Register now and build something that matters."
    />
    <meta name="theme-color" content="#070B14" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SAARTHI Hackathon 2026 — Build the Future" />
    <meta
      property="og:description"
      content="A 48-hour Open Innovation hackathon. 2–4 November 2026. Register and build something that matters."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://saarthihackathon.in" />
    <meta property="og:site_name" content="SAARTHI Hackathon" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SAARTHI Hackathon 2026 — Build the Future" />
    <meta
      name="twitter:description"
      content="A 48-hour Open Innovation hackathon. 2–4 November 2026."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Structured Data: Event -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Event",
        "name": "SAARTHI Hackathon 2026",
        "description": "A 48-hour Open Innovation hackathon for students and developers.",
        "startDate": "2026-11-02",
        "endDate": "2026-11-04",
        "eventStatus": "https://schema.org/EventScheduled",
        "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
        "organizer": {
          "@type": "Organization",
          "name": "SAARTHI"
        }
      }
    </script>

    <!-- Google Fonts preconnect (fonts loaded in CSS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
